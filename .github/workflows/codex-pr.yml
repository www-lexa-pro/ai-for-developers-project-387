name: Codex по команде в PR

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions: {}

jobs:
  signal:
    if: >-
      github.repository == 'www-lexa-pro/ai-for-developers-project-387' &&
      github.event.comment.user.type == 'User' &&
      github.event.comment.user.login == 'www-lexa-pro' &&
      contains(github.event.comment.body, '/oc ') &&
      ((github.event_name == 'issue_comment' && github.event.issue.pull_request) ||
       (github.event_name == 'pull_request_review_comment' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          COMMENT: ${{ github.event.comment.id }}
        run: |
          jq -n --arg pr "$PR" --arg comment "$COMMENT" '{pr:$pr,comment:$comment}' > "$RUNNER_TEMP/request.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-command-${{ github.run_attempt }}
          path: ${{ runner.temp }}/request.json
          retention-days: 2
